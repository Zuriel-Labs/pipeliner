name: Reusable Quality Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check commit whitespace
        run: git -c core.hooksPath=/dev/null show --format= --check HEAD
