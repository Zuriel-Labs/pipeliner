<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Pipeliner — Local execution</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="execution.css"></head><body>
<header class="app-head"><div class="identity"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><div><strong>Pipeliner</strong><span class="subline">Your work. Your control.</span></div></div><span class="pill quiet">Local execution</span></header>
<main><section aria-labelledby="heading"><div class="work-head"><p class="kicker">Execution</p><h1 id="heading">Stay in control</h1><p id="target" class="work-sub">Loading repository…</p></div>
<div class="message assistant state"><span class="message-label">Current state</span><h2 id="state">Loading</h2><p id="detail" role="status" aria-live="polite" aria-atomic="true">Checking local execution.</p></div>
<div class="controls" role="group" aria-label="Execution controls"><button type="button" class="secondary" data-operation="status">Status</button><button type="button" class="secondary" data-operation="pause">Pause</button><button type="button" class="primary" data-operation="resume">Resume</button><button type="button" class="secondary" data-operation="stop">Stop</button></div>
<p class="small">Pause and Stop keep your Issue and work. Resume checks recovery before work continues.</p><p id="error" class="error" role="alert" hidden></p>
</section></main><script src="execution.js"></script></body></html>
