name: Reusable Quality Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check commit whitespace
        run: git -c core.hooksPath=/dev/null show --format= --check HEAD
